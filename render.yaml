# Render Blueprint for mondo – FREE test plan (no disk).
# ⚠️ Free web services have no persistent disk: the database lives on the temporary filesystem and is reset
#    on every deploy, restart and idle spin-down (after ~15 min without visits). On each fresh start mondo
#    re-creates the made-up demo boards (SEED_DEMO=1) and the admin user from ADMIN_EMAIL / ADMIN_PASSWORD.
#    Everyone has to log in again after a reset. For the paid setup with a disk see render-paid-disk.yaml.
services:
  - type: web
    name: mondo
    runtime: node
    rootDir: app
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /tmp/mondo-data    # temporary – wiped on restart
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: SEED_DEMO
        value: "1"
      - key: ADMIN_EMAIL
        value: simpope@gmail.com
      - key: ADMIN_NAME
        value: Simon
      - key: ADMIN_PASSWORD       # used on every fresh start (the DB is new each time)
        sync: false
      - key: GEOCODE_CONTACT
        value: simpope@gmail.com
      - key: VAPID_SUBJECT
        value: mailto:simpope@gmail.com
      # Set VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY so phone-alert keys stay the same across resets
      # (deploy-render.sh does this). Without them new keys are made on each start and phones must re-enable alerts.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
